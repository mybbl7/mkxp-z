name: Automatic Build

on:
  push:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']
  pull_request:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']
  workflow_dispatch:

jobs:
  verify-ruby-configure-scripts:
    name: Verify Ruby 3.1 configure scripts
    runs-on: ubuntu-latest
    container:
      image: nixos/nix:2.32.8
      options: -u root --privileged
      volumes:
        - /etc/ca-certificates:/etc/ca-certificates
        - /etc/ssl:/etc/ssl
    steps:
      - name: Checkout repository
        uses: taiki-e/checkout-action@v1

      - name: Enable Nix sandboxing
        run: |
          echo 'sandbox = true' >> /etc/nix/nix.conf

      - name: Install dependencies
        run: |
          nix-channel --add https://nixos.org/channels/nixos-25.11 nixpkgs
          nix-channel --update nixpkgs
          nix-shell -p autoconf meson --run ''

      - name: Verify
        run: |
          nix-shell -p autoconf meson --run '
            meson subprojects download ruby-3.1
            cd subprojects/ruby-3.1
            old_configure_hash="$(sha256sum configure)"
            echo "old: $old_configure_hash"
            old_config_guess_hash="$(sha256sum tool/config.guess)"
            echo "old: $old_config_guess_hash"
            old_config_sub_hash="$(sha256sum tool/config.sub)"
            echo "old: $old_config_sub_hash"
            autoreconf -fi
            new_configure_hash="$(sha256sum configure)"
            echo "new: $new_configure_hash"
            new_config_guess_hash="$(sha256sum tool/config.guess)"
            echo "new: $new_config_guess_hash"
            new_config_sub_hash="$(sha256sum tool/config.sub)"
            echo "new: $new_config_sub_hash"
            error_flag=
            if [ "$old_configure_hash" != "$new_configure_hash" ]
            then
              echo "::error::configure hash does not match"
              error_flag=1
            fi
            if [ "$old_config_guess_hash" != "$new_config_guess_hash" ]
            then
              echo "::error::tool/config.guess hash does not match"
              error_flag=1
            fi
            if [ "$old_config_sub_hash" != "$new_config_sub_hash" ]
            then
              echo "::error::tool/config.sub hash does not match"
              error_flag=1
            fi
            if [ -n "$error_flag" ]
            then
              exit 1
            fi
          '

  build-linux-i386:
    name: Ubuntu 22.04 i386
    runs-on: ubuntu-22.04
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7
  
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y \
            git diffutils ruby bison \
            gcc-multilib g++-multilib libc6-dev-i386 lib32stdc++6 \
            libstdc++-11-dev:i386 libgcc-11-dev:i386 || true
          # Try to install libc++ dev packages if available (some runners may not have them)
          sudo apt install -y libc++-dev:i386 libc++abi-dev:i386 || true
          sudo apt install -y ccache make cmake ninja-build python3-pip
          pip3 install --user meson
          # Ensure meson is on PATH for the session
          export PATH="$HOME/.local/bin:$PATH"
          meson --version || true
  
      - name: Checkout repository
        uses: actions/checkout@v5
  
      - name: Restore from cache
        if: true
        uses: actions/cache/restore@v5
        with:
          path: ccache
          key: ubuntu-jammy-i386-
          restore-keys: ubuntu-jammy-i386-
  
      - name: Set up ccache
        run: |
          ccache --set-config=cache_dir="$(pwd)/ccache"
          ccache --set-config=compiler_check=content
          ccache --set-config=max_size=1280MiB
          ccache --zero-stats
  
      - name: Create gcc/g++ wrappers and verify PATH
        run: |
          # Create wrappers named gcc and g++ that always add -m32
          cat > ./gcc <<'EOF'
          #!/usr/bin/env bash
          exec /usr/bin/gcc -m32 "$@"
          EOF
          cat > ./g++ <<'EOF'
          #!/usr/bin/env bash
          exec /usr/bin/g++ -m32 "$@"
          EOF
          chmod +x ./gcc ./g++
          echo "Wrapper files created:"
          ls -l ./gcc ./g++ || true
          echo "Workspace path: $(pwd)"
  
      - name: Configure (force 32-bit, disable LTO, show meson logs)
        env:
          CC: gcc
          CXX: g++
          CFLAGS: -m32
          CXXFLAGS: -m32
          LDFLAGS: -m32
        run: |
          # Prepend workspace to PATH for this shell only so wrappers are found first
          export PATH="$(pwd):$PATH"
          echo "PATH=$PATH"
          echo "which gcc; which g++; which rm"
          which gcc || true
          which g++ || true
          which rm || true
  
          # Clean and reconfigure; disable LTO for multilib builds
          rm -rf build
          # Ensure meson from pip user install is available
          export PATH="$HOME/.local/bin:$PATH"
          meson setup --wipe --reconfigure \
            --prefix "$(realpath .)/build/artifact" \
            --buildtype release -Dstrip=true -Db_lto=false build || true
  
          echo "=== meson configure summary ==="
          meson configure -C build || true
  
          echo "=== head of meson log ==="
          head -n 200 build/meson-logs/meson-log.txt || true
  
          echo "=== quick compile test (small C++ file) ==="
          echo '#include <iostream>
          int main(){ std::cout << \"ok\\n\"; return 0; }' > /tmp/test.cpp
          g++ -m32 -c /tmp/test.cpp -o /tmp/test.o && file /tmp/test.o || true
          echo "=== end configure step ==="
  
      - name: Build
        id: build
        run: |
          exit_code=0
          CLICOLOR_FORCE=1 ninja -C build -v || exit_code=$?
          echo exit-code=$exit_code >> "$GITHUB_OUTPUT"
          date -u +time=%Y-%m-%dT%H:%M:%SZ >> "$GITHUB_OUTPUT"
          if [ $exit_code -ne 0 ]; then
            echo "=== Last 200 lines of meson log ==="
            tail -n 200 build/meson-logs/meson-log.txt || true
            echo "=== Ninja verbose output (last 200 lines) ==="
            # ninja log file may not exist; show ninja stderr from build dir if present
            if [ -f build/meson-logs/ninja-log.txt ]; then
              tail -n 200 build/meson-logs/ninja-log.txt || true
            fi
          fi
          exit $exit_code
  
      - name: Save to cache
        if: true
        uses: actions/cache/save@v5
        with:
          path: ccache
          key: ubuntu-jammy-i386-${{ github.sha }}-${{ steps.build.outputs.time }}
  
      - name: Show ccache statistics
        run: |
          ccache --show-stats --verbose
  
      - name: Prepare artifact
        run: |
          meson install -C build --no-rebuild --tags mkxp-z || true
          echo "Built binary file type (if present):"
          file build/artifact/bin/mkxp-z || true
  
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.linux.ubuntu.22.04.i386.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/artifact

