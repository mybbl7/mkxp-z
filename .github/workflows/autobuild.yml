name: Automatic Build

on:
  push:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']
  pull_request:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']
  workflow_dispatch:

jobs:
  verify-ruby-configure-scripts:
    name: Verify Ruby 3.1 configure scripts
    runs-on: ubuntu-latest
    container:
      image: nixos/nix:2.32.8
      options: -u root --privileged
      volumes:
        - /etc/ca-certificates:/etc/ca-certificates
        - /etc/ssl:/etc/ssl
    steps:
      - name: Checkout repository
        uses: taiki-e/checkout-action@v1

      - name: Enable Nix sandboxing
        run: |
          echo 'sandbox = true' >> /etc/nix/nix.conf

      - name: Install dependencies
        run: |
          nix-channel --add https://nixos.org/channels/nixos-25.11 nixpkgs
          nix-channel --update nixpkgs
          nix-shell -p autoconf meson --run ''

      - name: Verify
        run: |
          nix-shell -p autoconf meson --run '
            meson subprojects download ruby-3.1
            cd subprojects/ruby-3.1
            old_configure_hash="$(sha256sum configure)"
            echo "old: $old_configure_hash"
            old_config_guess_hash="$(sha256sum tool/config.guess)"
            echo "old: $old_config_guess_hash"
            old_config_sub_hash="$(sha256sum tool/config.sub)"
            echo "old: $old_config_sub_hash"
            autoreconf -fi
            new_configure_hash="$(sha256sum configure)"
            echo "new: $new_configure_hash"
            new_config_guess_hash="$(sha256sum tool/config.guess)"
            echo "new: $new_config_guess_hash"
            new_config_sub_hash="$(sha256sum tool/config.sub)"
            echo "new: $new_config_sub_hash"
            error_flag=
            if [ "$old_configure_hash" != "$new_configure_hash" ]
            then
              echo "::error::configure hash does not match"
              error_flag=1
            fi
            if [ "$old_config_guess_hash" != "$new_config_guess_hash" ]
            then
              echo "::error::tool/config.guess hash does not match"
              error_flag=1
            fi
            if [ "$old_config_sub_hash" != "$new_config_sub_hash" ]
            then
              echo "::error::tool/config.sub hash does not match"
              error_flag=1
            fi
            if [ -n "$error_flag" ]
            then
              exit 1
            fi
          '
  build-linux-cross:
    name: Ubuntu 22.04 ${{ matrix.arch_mkxpz }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_mkxpz: armv6
            arch_debian: armhf
            arch_gcc: arm-linux-gnueabihf
            cache: false
          - arch_mkxpz: armv7-neon
            arch_debian: armhf
            arch_gcc: arm-linux-gnueabihf
            cache: false
          - arch_mkxpz: arm64
            arch_debian: arm64
            arch_gcc: aarch64-linux-gnu
            cache: true
          - arch_mkxpz: power8le
            arch_debian: ppc64el
            arch_gcc: powerpc64le-linux-gnu
            cache: false
          - arch_mkxpz: s390x
            arch_debian: s390x
            arch_gcc: s390x-linux-gnu
            cache: false
          - arch_mkxpz: riscv64
            arch_debian: riscv64
            arch_gcc: riscv64-linux-gnu
            cache: false
          - arch_mkxpz: i386
            arch_debian: i386
            arch_gcc: i686-linux-gnu
            cache: true
  
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7
  
      - name: Install dependencies
        run: |
          set -euo pipefail
      
          # Repair apt state and refresh lists
          sudo apt-get -y --fix-broken install || true
          sudo apt-get update
      
          # Add target architecture and ports repos only for non-amd64 cross targets
          if [ "${{ matrix.arch_debian }}" != "amd64" ] && [ "${{ matrix.arch_debian }}" != "i386" ]; then
            sudo sed -i "s/^deb /deb [arch=amd64] /g" /etc/apt/sources.list || true
            echo "deb [arch=${{ matrix.arch_debian }}] http://ports.ubuntu.com/ jammy main restricted" | sudo tee -a /etc/apt/sources.list
            echo "deb [arch=${{ matrix.arch_debian }}] http://ports.ubuntu.com/ jammy-updates main restricted" | sudo tee -a /etc/apt/sources.list
            echo "deb [arch=${{ matrix.arch_debian }}] http://ports.ubuntu.com/ jammy universe" | sudo tee -a /etc/apt/sources.list
            echo "deb [arch=${{ matrix.arch_debian }}] http://ports.ubuntu.com/ jammy-updates universe" | sudo tee -a /etc/apt/sources.list
            echo "deb [arch=${{ matrix.arch_debian }}] http://ports.ubuntu.com/ jammy multiverse" | sudo tee -a /etc/apt/sources.list
            echo "deb [arch=${{ matrix.arch_debian }}] http://ports.ubuntu.com/ jammy-updates multiverse" | sudo tee -a /etc/apt/sources.list
            echo "deb [arch=${{ matrix.arch_debian }}] http://ports.ubuntu.com/ jammy-backports main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
            sudo apt-get update
            sudo dpkg --add-architecture ${{ matrix.arch_debian }} || true
            sudo apt-get update
          else
            # For i386 and amd64, just register the architecture (no ports entries)
            if [ "${{ matrix.arch_debian }}" = "i386" ]; then
              sudo dpkg --add-architecture i386 || true
              sudo apt-get update
            fi
          fi
      
          # Core build tools
          sudo apt-get install -y --no-install-recommends \
            git diffutils ruby bison ccache make cmake ninja-build python3-pip || true
      
          # Install meson via pip (user) and ensure it's on PATH
          pip3 install --user meson
          export PATH="$HOME/.local/bin:$PATH"
          meson --version || true
      
          # Native compilers
          sudo apt-get install -y --no-install-recommends gcc g++ || true
      
          # Install cross compilers for the matrix arch (i686-linux-gnu for i386)
          sudo apt-get install -y --no-install-recommends gcc-${{ matrix.arch_gcc }} g++-${{ matrix.arch_gcc }} || true
      
          # If target is i386, also install multilib support (best-effort)
          if [ "${{ matrix.arch_mkxpz }}" = "i386" ]; then
            sudo apt-get install -y --no-install-recommends gcc-multilib g++-multilib libc6-dev-i386 lib32stdc++6 || true
          fi

  
      - name: Checkout repository
        uses: actions/checkout@v5
  
      - name: Restore from cache
        if: ${{ matrix.cache }}
        uses: actions/cache/restore@v5
        with:
          path: ccache
          key: ubuntu-jammy-${{ matrix.arch_mkxpz }}-
          restore-keys: ubuntu-jammy-${{ matrix.arch_mkxpz }}-
  
      - name: Set up ccache
        run: |
          ccache --set-config=cache_dir="$(pwd)/ccache"
          ccache --set-config=compiler_check=content
          ccache --set-config=max_size=1280MiB
          ccache --zero-stats
  
      - name: Configure
        run: |
          set -euo pipefail
  
          if [ '${{ matrix.arch_mkxpz }}' = 'armv7-neon' ]; then
            arm_neon=auto
          else
            arm_neon=disabled
          fi
  
          if [ '${{ matrix.arch_mkxpz }}' = 'i386' ]; then
            meson setup --prefix "$(realpath .)/build/artifact" \
              --cross-file linux/meson-i386.txt \
              --buildtype release -Dstrip=true -Db_lto=false -Dcpp_std=gnu++17 build
          else
            meson setup --prefix "$(realpath .)/build/artifact" \
              --cross-file linux/meson-${{ matrix.arch_mkxpz }}.txt \
              -Darm_neon=$arm_neon --buildtype release -Dstrip=true -Db_lto=true build
          fi
  
      - name: Build
        id: build
        run: |
          exit_code=0
          CLICOLOR_FORCE=1 ninja -C build -v || exit_code=$?
          echo exit-code=$exit_code >> "$GITHUB_OUTPUT"
          date -u +time=%Y-%m-%dT%H:%M:%SZ >> "$GITHUB_OUTPUT"
  
      - name: Save to cache
        if: ${{ matrix.cache }}
        uses: actions/cache/save@v5
        with:
          path: ccache
          key: ubuntu-jammy-${{ matrix.arch_mkxpz }}-${{ github.sha }}-${{ steps.build.outputs.time }}
  
      - name: Show ccache statistics
        run: |
          ccache --show-stats --verbose
  
      - name: Check build status
        run: |
          exit ${{ steps.build.outputs.exit-code }}
  
      - name: Prepare artifact
        run: |
          meson install -C build --no-rebuild --tags mkxp-z
  
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.linux.ubuntu.22.04.${{ matrix.arch_mkxpz }}.${{ github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name }}-${{ steps.short-sha.outputs.sha }}
          path: build/artifact

